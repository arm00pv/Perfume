<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScentLens AI</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar-brand {
            font-weight: bold;
            color: #6f42c1 !important;
        }
        .hero-section {
            background: linear-gradient(135deg, #6f42c1 0%, #a64bf4 100%);
            color: white;
            padding: 3rem 0;
            margin-bottom: 2rem;
            border-radius: 0 0 20px 20px;
        }
        #video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            background-color: #000;
        }
        video {
            width: 100%;
            display: block;
        }
        #canvas {
            display: none;
        }
        .result-card {
            transition: transform 0.2s;
            border: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .result-card:hover {
            transform: translateY(-5px);
        }
        .note-badge {
            font-size: 0.9em;
            margin: 2px;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            visibility: hidden;
        }
        .nav-pills .nav-link.active {
            background-color: #6f42c1;
        }
        .nav-pills .nav-link {
            color: #6f42c1;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-flower1" viewBox="0 0 16 16" style="margin-right: 8px;">
                  <path d="M6.174 1.184c0 .845.69 1.528 1.528 1.528s1.528-.693 1.528-1.528S8.537.244 7.702.244 6.174.928 6.174 1.184M3.87 3.476c0 .844.69 1.528 1.528 1.528s1.528-.694 1.528-1.528-.693-1.528-1.528-1.528-1.528.694-1.528 1.528m6.706 0c0 .844.69 1.528 1.528 1.528s1.528-.694 1.528-1.528-.694-1.528-1.528-1.528-1.528.694-1.528 1.528m-3.352 9.834c0 .844.69 1.528 1.528 1.528s1.528-.693 1.528-1.528-.693-1.528-1.528-1.528-1.528.693-1.528 1.528m-3.352-3.12c0 .845.69 1.528 1.528 1.528s1.528-.694 1.528-1.528-.693-1.528-1.528-1.528-1.528.694-1.528 1.528m6.704 0c0 .845.69 1.528 1.528 1.528s1.528-.694 1.528-1.528-.694-1.528-1.528-1.528-1.528.694-1.528 1.528m-3.352-2.64c0 1.28-.662 1.592-1.528 2.435-.895-.868-1.528-1.148-1.528-2.435 0-1.272 1.418-2.304 3.056-2.304s3.056 1.032 3.056 2.304"/>
                </svg>
                ScentLens AI
            </a>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="hero-section text-center">
        <div class="container">
            <h1 class="display-4">Discover Your Perfect Scent</h1>
            <p class="lead">Use AI to identify perfumes and explore their scent profiles instantly.</p>
        </div>
    </div>

    <div class="container">

        <!-- Navigation Tabs -->
        <ul class="nav nav-pills mb-4 justify-content-center" id="pills-tab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="pills-camera-tab" data-bs-toggle="pill" data-bs-target="#pills-camera" type="button" role="tab">📷 Camera Scan</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="pills-upload-tab" data-bs-toggle="pill" data-bs-target="#pills-upload" type="button" role="tab">📂 Upload Image</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="pills-search-tab" data-bs-toggle="pill" data-bs-target="#pills-search" type="button" role="tab">🔍 Manual Search</button>
            </li>
        </ul>

        <div class="tab-content" id="pills-tabContent">

            <!-- Camera Tab -->
            <div class="tab-pane fade show active" id="pills-camera" role="tabpanel">
                <div class="text-center">
                    <div id="video-container">
                        <video id="video" autoplay playsinline></video>
                    </div>
                    <button id="capture-btn" class="btn btn-lg btn-primary mt-3 shadow">
                        <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                        Capture & Identify
                    </button>
                    <canvas id="canvas"></canvas>
                </div>
            </div>

            <!-- Upload Tab -->
            <div class="tab-pane fade" id="pills-upload" role="tabpanel">
                <div class="row justify-content-center">
                    <div class="col-md-6">
                        <div class="card shadow-sm p-4">
                            <div class="mb-3">
                                <label for="formFile" class="form-label">Choose an image of a perfume</label>
                                <input class="form-control" type="file" id="formFile" accept="image/*">
                            </div>
                            <button id="upload-btn" class="btn btn-primary w-100">Analyze Image</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Search Tab -->
            <div class="tab-pane fade" id="pills-search" role="tabpanel">
                 <div class="row justify-content-center">
                    <div class="col-md-6">
                        <div class="input-group mb-3">
                            <input type="text" id="search-input" class="form-control form-control-lg" placeholder="Enter perfume name (e.g. Dior Sauvage)">
                            <button class="btn btn-primary" type="button" id="search-btn">Search</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Results Section -->
        <div id="results-section" class="mt-5 mb-5 d-none">
            <h2 class="text-center mb-4">Analysis Results</h2>
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card result-card">
                        <div class="row g-0">
                            <div class="col-md-4 text-center p-3 bg-light d-flex align-items-center justify-content-center">
                                <img id="result-image" src="https://via.placeholder.com/200" class="img-fluid rounded-start" alt="Perfume Image" style="max-height: 300px;">
                            </div>
                            <div class="col-md-8">
                                <div class="card-body">
                                    <h3 class="card-title" id="result-name">Perfume Name</h3>
                                    <p class="card-text text-muted" id="result-desc">AI Confidence: <span id="result-confidence">-</span></p>

                                    <div class="mb-3 p-2 bg-info bg-opacity-10 border border-info rounded">
                                        <strong>✨ AI Recommendation:</strong> <span id="result-recommendation">Loading...</span>
                                    </div>

                                    <div id="result-notes">
                                        <!-- Notes will be injected here -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Error Alert -->
        <div id="error-alert" class="alert alert-danger mt-4 d-none text-center" role="alert">
            Something went wrong.
        </div>

    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="text-center">
            <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3 lead">Analyzing Scent Profile...</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // DOM Elements
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('capture-btn');
        const uploadBtn = document.getElementById('upload-btn');
        const fileInput = document.getElementById('formFile');
        const searchBtn = document.getElementById('search-btn');
        const searchInput = document.getElementById('search-input');
        const resultsSection = document.getElementById('results-section');
        const errorAlert = document.getElementById('error-alert');
        const loadingOverlay = document.getElementById('loading-overlay');

        // Results Elements
        const resultImage = document.getElementById('result-image');
        const resultName = document.getElementById('result-name');
        const resultConfidence = document.getElementById('result-confidence');
        const resultNotes = document.getElementById('result-notes');
        const resultRecommendation = document.getElementById('result-recommendation');

        // Camera Logic
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;
            } catch (err) {
                console.error("Error accessing camera: ", err);
                // Don't alert immediately, maybe user denied or no camera.
                // Just show a placeholder or disable camera tab button if possible.
            }
        }

        // Only start camera when tab is active to save resources
        document.getElementById('pills-camera-tab').addEventListener('shown.bs.tab', startCamera);
        // Initial start if on camera tab
        if(document.getElementById('pills-camera').classList.contains('active')) {
            startCamera();
        }

        function showLoading(show) {
            loadingOverlay.style.visibility = show ? 'visible' : 'hidden';
            errorAlert.classList.add('d-none');
            resultsSection.classList.add('d-none');
        }

        function showError(msg) {
            errorAlert.textContent = msg;
            errorAlert.classList.remove('d-none');
        }

        function renderResults(data) {
            console.log(data);
            const profile = data.fragrance_profile;

            if (!profile || profile.error) {
                showError(profile ? profile.error : "Unknown error occurred.");
                return;
            }

            // If we have a detected label from Roboflow, use it, otherwise use the name from scraping
            let name = profile.name;
            if (data.detected_labels && data.detected_labels.length > 0) {
               // Prefer the full name from profile if available, else the label
               if (profile.name == profile.query) { // If scraping didn't find a better title
                   name = data.detected_labels[0];
               }
            }

            resultName.textContent = name;

            // Confidence
            if (data.raw_prediction && data.raw_prediction.predictions && data.raw_prediction.predictions.length > 0) {
                const conf = (data.raw_prediction.predictions[0].confidence * 100).toFixed(1);
                resultConfidence.textContent = `${conf}%`;
            } else {
                resultConfidence.textContent = "N/A (Manual Search)";
            }

            // Image
            if (profile.image_url) {
                resultImage.src = profile.image_url;
            } else {
                resultImage.src = "https://via.placeholder.com/200?text=No+Image";
            }

            // Recommendation
            resultRecommendation.textContent = profile.recommendation || "Explore this scent to see if it fits you!";

            // Notes
            let notesHtml = '';
            if (profile.notes) {
                for (const [type, notes] of Object.entries(profile.notes)) {
                    notesHtml += `<h5 class="mt-3 text-capitalize">${type}</h5>`;
                    notesHtml += `<div>`;
                    notes.forEach(note => {
                        // Color code badges based on note type roughly?
                        let badgeClass = "bg-secondary";
                        if (type.toLowerCase().includes('top')) badgeClass = "bg-warning text-dark";
                        if (type.toLowerCase().includes('middle') || type.toLowerCase().includes('heart')) badgeClass = "bg-danger";
                        if (type.toLowerCase().includes('base')) badgeClass = "bg-dark";

                        notesHtml += `<span class="badge rounded-pill ${badgeClass} note-badge">${note}</span>`;
                    });
                    notesHtml += `</div>`;
                }
            } else {
                notesHtml = '<p>No specific notes found.</p>';
            }
            resultNotes.innerHTML = notesHtml;

            resultsSection.classList.remove('d-none');
            // Scroll to results
            resultsSection.scrollIntoView({ behavior: 'smooth' });
        }

        // Capture Button
        captureBtn.addEventListener('click', async () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL('image/png');
            
            handleIdentification(dataUrl);
        });

        // Upload Button
        uploadBtn.addEventListener('click', () => {
            const file = fileInput.files[0];
            if (!file) {
                alert("Please select a file first.");
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                handleIdentification(e.target.result);
            };
            reader.readAsDataURL(file);
        });

        // Search Button
        searchBtn.addEventListener('click', async () => {
            const query = searchInput.value.trim();
            if (!query) return;

            showLoading(true);
            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });

                const data = await response.json();
                renderResults(data); // structure might need slight adjust if backend format differs
            } catch (error) {
                console.error(error);
                showError("Network error or server issue.");
            } finally {
                showLoading(false);
            }
        });

        async function handleIdentification(dataUrl) {
            showLoading(true);
            try {
                const response = await fetch('/api/identify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: dataUrl }),
                });

                // If we get a 503 (Service Unavailable), it might be the API key missing
                if (response.status === 503) {
                    const data = await response.json();
                    showError(data.error || "Service unavailable. Please try manual search.");
                    return;
                }

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                renderResults(data);

            } catch (error) {
                console.error('Error:', error);
                showError("Could not identify perfume. Please try again or use manual search.");
            } finally {
                showLoading(false);
            }
        }

    </script>
</body>
</html>
